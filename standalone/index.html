document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

,255,255,0.16); border-radius: 999px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #a99ec2; transition: all 200ms ease; white-space: nowrap;\" style-hover=\"color: #f2eefb; border-color: rgba(196,166,255,0.7);\">← sair do cérebro<\u002Fdiv>\n          <div style=\"height: 1px; flex: 1; min-width: 40px; background: linear-gradient(90deg, rgba(169,123,255,0.5), rgba(255,255,255,0.05));\"><\u002Fdiv>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #c4a6ff;\">{{ panelKicker }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <h1 style=\"margin: 0; font-size: clamp(28px, 5vw, 42px); font-weight: 600; letter-spacing: -0.03em;\">{{ panelTitle }}<\u002Fh1>\n\n        <!-- SEGUNDO CÉREBRO -->\n        <sc-if value=\"{{isBrainPanel}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n            <div style=\"border: 1px solid rgba(169,123,255,0.38); border-radius: 18px; background: rgba(169,123,255,0.07); padding: 6px 6px 6px 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #c4a6ff;\">/<\u002Fspan>\n              <input value=\"{{ query }}\" sc-camel-on-change=\"{{onQuery}}\" placeholder=\"pergunte ou pesquise: git, css, contrato, como organizo a semana...\" style=\"flex: 1 1 200px; background: transparent; border: none; color: #f2eefb; font-size: 16px; padding: 15px 0; min-width: 0;\">\n              <div style=\"padding: 12px 18px; border-radius: 12px; background: rgba(169,123,255,0.2); border: 1px solid rgba(169,123,255,0.45); font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #e4d5ff;\">buscar<\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{hasQuery}}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border: 1px solid rgba(196,166,255,0.28); border-radius: 16px; background: linear-gradient(180deg, rgba(169,123,255,0.14), rgba(169,123,255,0.03)); padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; animation: rise 300ms ease-out both;\">\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #c4a6ff;\">resposta do seu cérebro<\u002Fdiv>\n                <div style=\"font-size: 16.5px; line-height: 1.65; color: #f2eefb; text-wrap: pretty;\">{{ aiAnswer }}<\u002Fdiv>\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8f83ab; line-height: 1.6;\">{{ aiSources }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display: flex; flex-wrap: wrap; gap: 9px;\">\n              <sc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"7\">\n                <div sc-camel-on-click=\"{{c.onClick}}\" style=\"cursor: pointer; padding: 9px 15px; border-radius: 999px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; transition: all 180ms ease; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}};\">{{ c.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #7a7096; letter-spacing: 0.1em;\">{{ resultLabel }}<\u002Fdiv>\n\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 310px), 1fr)); gap: 16px;\">\n              <sc-for list=\"{{ results }}\" as=\"n\" hint-placeholder-count=\"4\">\n                <div style=\"border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; background: rgba(255,255,255,0.035); padding: 20px; display: flex; flex-direction: column; gap: 12px; animation: rise a(255,255,255,0.16); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px;\">\n              <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #7a7096;\">guardar algo novo<\u002Fdiv>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 10px;\">\n                <input value=\"{{ nn.t }}\" sc-camel-on-change=\"{{onNoteTitle}}\" placeholder=\"título\" style=\"flex: 1 1 200px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 12px 14px; color: #f2eefb; font-size: 14px;\">\n                <input value=\"{{ nn.body }}\" sc-camel-on-change=\"{{onNoteBody}}\" placeholder=\"conteúdo, código, link, nome do arquivo...\" style=\"flex: 2 1 280px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 12px 14px; color: #f2eefb; font-size: 14px; font-family: 'IBM Plex Mono', monospace;\">\n                <input value=\"{{ nn.tags }}\" sc-camel-on-change=\"{{onNoteTags}}\" placeholder=\"tags\" style=\"flex: 1 1 130px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 12px 14px; color: #f2eefb; font-size: 14px;\">\n                <div sc-camel-on-click=\"{{addNote}}\" style=\"cursor: pointer; padding: 12px 20px; border-radius: 10px; background: rgba(169,123,255,0.2); border: 1px solid rgba(169,123,255,0.45); color: #e4d5ff; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;\">salvar<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- FINANÇAS -->\n        <sc-if value=\"{{isFinPanel}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 26px;\">\n            <div style=\"display: grid; grid-template-columns: r div>\n                <div style=\"font-size: 28px; font-weight: 600; letter-spacing: -0.02em;\">{{ billsTotal }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 20px; background: rgba(255,255,255,0.022);\">\n              <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap;\">\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #7a7096;\">evolução dos últimos 6 meses<\u002Fdiv>\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8f83ab;\">barra clara = entrada · escura = saída<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display: flex; align-items: flex-end; gap: 3%; height: 190px;\">\n                <sc-for list=\"{{ months }}\" as=\"m\" hint-placeholder-count=\"6\">\n                  <div style=\"flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; height: 100%; justify-content: flex-end;\">\n                    <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: {{m.netColor}};\">{{ m.net }}<\u002Fdiv>\n                    <div style=\"display: flex; align-items: flex-end; gap: 4px; width: 100%; justify-content: center; height: 100%;\">\n                      <div style=\"width: 26%; min-width: 8px; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, #c4a6ff, #7c4dff); height: {{m.hIn}};\"><\u002Fdiv>\n                      <div style=\"width: 26%; min-width: 8px; border-radius: 4px 4px 0 0; background: rgba(255,255,255,0.14); height: {{m.hOut}};\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #7a7096;\">{{ m.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 20px;\">\n              <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #7a7096;\">lançamentos<\u002Fdiv>\n                <div style=\"border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; overflow: hidden;\">\n                  <sc-for list=\"{{ txs }}\" as=\"x\" hint-placeholder-count=\"5\">\n                    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 18px; border-bottom: 1px solid rgba(255,255,255,0.06);\">\n                      <div style=\"display: flex; flex-direction: column; gap: 3px; min-width: 0;\">\n                        <div style=\"font-size: 14.5px; font-weight: 500;\">{{ x.d }}<\u002Fdiv>\n                        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #7a7096; letter-spacing: 0.08em;\">{{ x.c }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; white-space: nowrap; color: {{x.color}};\">{{ x.amount }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display: flex; flex-wrap: wrap; gap: 10px; border: 1px dashed rgba(255,255,255,0.16); border-radius: 14px; padding: 16px;\">\n                  <input value=\"{{ nf.d }}\" sc-camel-on-change=\"{{onFinDesc}}\" placeholder=\"descrição\" style=\"flex: 2 1 160px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 11px 14px; color: #f2eefb; font-size: 14px;\">\n                  <input value=\"{{ nf.v }}\" sc-camel-on-change=\"{{onFinVal}}\" placeholder=\"valor\" style=\"flex: 0 1 100px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 11px 14px; color: #f2eefb; font-size: 14px; font-family: 'IBM Plex Mono', monospace;\">\n                  <div sc-camel-on-click=\"{{toggleFinType}}\" style=\"cursor: pointer; padding: 11px 16px; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid {{finTypeBd}}; color: {{finTypeFg}}; background: {{finTypeBg}};\">{{ finTypeLabel }}<\u002Fdiv>\n                  <div sc-camel-on-click=\"{{addTx}}\" style=\"cursor: pointer; padding: 11px 20px; border-radius: 10px; background: rgba(169,123,255,0.2); border: 1px solid rgba(169,123,255,0.45); color: #e4d5ff; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;\">lançar<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display: flex; flex-direction: column; gap: 22px;\">\n                <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n                  <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #7a7096;\">contas a pagar<\u002Fdiv>\n                  <div style=\"border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; overflow: hidden;\">\n                    <sc-for list=\"{{ bills }}\" as=\"b\" hint-placeholder-count=\"4\">\n                      <div sc-camel-on-click=\"{{b.onToggle}}\" style=\"cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.06);\">\n                        <div style=\"width: 17px; height: 17px; border-radius: 5px; flex-shrink: 0; display: fle  (nar ? 0.86 : 0.6), h) * (nar ? 0.26 : 0.30);\n      const yaw = t * 0.00019, pitch = Math.sin(t * 0.00014) * 0.2;\n\n      // halo do núcleo\n      const hg = ctx.createRadialGradient(cx, cy, 0, cx, cy, sc * (0.62 + e * 1.4));\n      hg.addColorStop(0, \"rgba(196,166,255,\" + (0.34 * fade).toFixed(3) + \")\");\n      hg.addColorStop(0.55, \"rgba(124,77,255,\" + (0.14 * fade).toFixed(3) + \")\");\n      hg.addColorStop(1, \"rgba(124,77,255,0)\");\n      ctx.fillStyle = hg;\n      ctx.beginPath(); ctx.arc(cx, cy, sc * (0.62 + e * 1.4), 0, 6.2832); ctx.fill();\n\n      // anéis\n      orbits.forEach((o, oi) => {\n        const ph = t * o.spin;\n        const pts = [];\n        for (let k = 0; k <= 70; k++) {\n          const a = (k / 70) * 6.2832;\n          const base = { x: Math.cos(a) * o.r, y: Math.sin(a) * o.r * 0.34, z: Math.sin(a) * o.r };\n          const tl = { x: base.x, y: base.y * Math.cos(o.tilt) - base.z * Math.sin(o.tilt), z: base.y * Math.sin(o.tilt) + base.z * Math.cos(o.tilt) };\n          const r = rot(tl, yaw + ph, pitch);\n          const k2 = 3.2 / (3.2 - r.z);\n          const push = 1 + blow * 0.5;\n          pts.push({ X: cx + r.x * sc * k2 * push, Y: cy + r.y * sc * k2 * push, k: k2 });\n        }\n        ctx.lineWidth = 1;\n        for (let k = 0; k < pts.length - 1; k++) {\n          const a = pts[k], b = pts[k + 1];\n          const al = Math.max(0, (a.k - 0.82)) * 0.5 * fade;\n          ctx.strokeStyle = \"rgba(196,166,255,\" + al.toFixed(3) + \")\";\n          ctx.beginPath(); ctx.moveTo(a.X, a.Y); ctx.lineTo(b.X, b.Y); ctx.stroke();\n        }\n        for (let n = 0; n < o.nodes; n++) {\n          const idx = Math.floor((((t * 0.00006 * (oi + 1)) + n / o.nodes) % 1) * 70);\n          const p = pts[idx];\n          const a = Math.min(1, Math.max(0.1, (p.k - 0.7) * 1.5)) * fade;\n          ctx.beginPath(); ctx.arc(p.X, p.Y, 2.6 * p.k, 0, 6.2832);\n          ctx.fillStyle = \"rgba(233,222,255,\" + a.toFixed(3) + \")\";\n          ctx.shadowBlur = 12; ctx.shadowColor = \"rgba(169,123,255,0.9)\";\n          ctx.fill(); ctx.shadowBlur = 0;\n        }\n      });\n\n      // núcleo\n      for (const p of core) {\n        const q = rot({ x: p.x + p.dx * blow, y: p.y + p.dy * blow, z: p.z + p.dz * blow }, yaw * 1.6, pitch);\n        const k = 3.2 / (3.2 - q.z);\n        const tw = 0.55 + 0.45 * Math.sin(t * 0.0018 + p.ph);\n        const a = Math.min(1, Math.max(0.08, (k - 0.72) * 1.6)) * tw * fade;\n        ctx.beginPath();\n        ctx.arc(cx + q.x * sc * k, cy + q.y * sc * k, p.s * k * (1.3 + e * 0.6), 0, 6.2832);\n        ctx.fillStyle = \"rgba(243,238,255,\" + a.toFixed(3) + \")\";\n        ctx.shadowBlur = 9 * k; ctx.shadowColor = \"rgba(169,123,255,0.75)\";\n        ctx.fill(); ctx.shadowBlur = 0;\n      }\n\n      // conexões com as abas\n      anchors.forEach((an, n) => {\n        const ax = an[0] * w, ay = an[1] * h;\n        const a0 = (n / 5) * 6.2832 + t * 0.00019;\n        const gx = cx + Math.cos(a0) * sc * 0.5, gy = cy + Math.sin(a0) * sc * 0.32;\n        ctx.strokeStyle = \"rgba(196,166,255,\" + (0.09 * fade).toFixed(3) + \")\";\n        ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(ax, ay); ctx.stroke();\n        const f = ((t * 0.00026) + n / 5) % 1;\n        ctx.beginPath();\n        ctx.arc(gx + (ax - gx) * f, gy + (ay - gy) * f, 2.2, 0, 6.2832);\n        ctx.fillStyle = \"rgba(233,222,255,\" + ((0.95 - Math.abs(f - 0.5)) * fade).toFixed(2) + \")\";\n        ctx.shadowBlur = 10; ctx.shadowColor = \"rgba(169,123,255,0.9)\";\n        ctx.fill(); ctx.shadowBlur = 0;\n      });\n\n      this._raf = requestAnimationFrame(frame);\n    };\n    this._raf = requestAnimationFrame(frame);\n  }\n\n  enter(view) {\n    this._diss = performance.now();\n    const n = this.hubRef.current;\n    if (n) {\n      n.querySelectorAll(\"div\").forEach(el => {\n        if (el.style.position === \"absolute\" && el.style.cursor === \"pointer\") { el.style.transition = \"opacity 320ms ease, transform 520ms ease\"; }\n      });\n      n.style.opacity = \"0\";\n    }\n    setTimeout(() => this.setState({ view }), 640);\n  }\n\n  money(v) { return \"R$ \" + Math.round(v).toLocaleString(\"pt-BR\"); }\n  short(v) { return v >= 1000 ? (v / 1000).toFixed(1).replace(\".\", \",\") + \"k\" : String(Math.round(v)); }\n\n  renderVals() {\n    const st = this.state, v = st.view;\n    const titles = {\n      brain: [\"arquivo pessoal\", \"Segundo Cérebro\"],\n      fin: [\"fluxo do mês\", \"Finanças pessoais\"],\n      ideias: [\"captura e execução\", \"Ideias\"],\n      check: [\"dia · semana · mês\", \"Checklist\"],\n      flows: [\"passo a passo\", \"Workflows\"]\n    };\n    const meta = titles[v] || [\"\", \"\"];\n\n    const types = [\"tudo\", \"NOTA\", \"CÓDIGO\", \"PDF\", \"LINK\", \"IMAGEM\", \"ATALHO\"];\n    const q = st.query.trim().toLowerCase();\n    const matches = st.notes.filter(n => {\n      if (!q) return false;\n      return (n.t + \" \" + n.body + \" \" + n.type + \" \" + n.tags.join(\" \")).toLowerCase().includes(q);\n    });\n    const results = st.notes.filter(n => {\n      if (st.chip !== \"tudo\" && n.type !== st.chip) return false;\n      if (!q) return true;\n      return (n.t + \" \" + n.body + \" \" + n.type + \" \" + n.tags.join(\" \")).toLowerCase().includes(q);\n    });\n\n    let aiAnswer = \"\", aiSources = \"\";\n    if (q) {\n      if (!matches.length) {\n        aiAnswer = \"Não encontrei nada sobre \\u201c\" + st.query.trim() + \"\\u201d ainda. Guarde a primeira nota sobre isso no campo abaixo e eu passo a responder por ela.\";\n        aiSources = \"0 fontes\";\n      } else {\n        const top = matches[0];\n        const tagPool = [];\n        matches.forEach(m => m.tags.forEach(t => { if (!tagPool.includes(t)) tagPool.push(t); }));\n        aiAnswer = \"Você tem \" + matches.length + (matches.length === 1 ? \" registro\" : \" registros\") + \" sobre \\u201c\" + st.query.trim() + \"\\u201d. O mais direto é \" + top.t + \": \" + top.body + (matches.length > 1 ? \" Os outros registros cobrem \" + tagPool.slice(0, 4).join(\", \") + \".\" : \"\");\n        aiSources = \"fontes: \" + matches.slice(0, 3).map(m => m.t).join(\" · \");\n      }\n    }\n\n    const chips = types.map(label => {\n      const on = st.chip === label;\n      return {\n        label: label === \"tudo\" ? \"tudo\" : label.toLowerCase(),\n        bd: on ? \"rgba(196,166,255,0.7)\" : \"rgba(255,255,255,0.14)\",\n        bg: on ? \"rgba(169,123,255,0.2)\" : \"rgba(255,255,255,0.04)\",\n        fg: on ? \"#e4d5ff\" : \"#a99ec2\",\n        onClick: () => this.setState({ chip: label })\n      };\n    });\n\n    const inSum = st.txs.filter(t => t.t === \"in\").reduce((a, b) => a + b.v, 0);\n    const outSum = st.txs.filter(t => t.t === \"out\").reduce((a, b) => a + b.v, 0);\n    const byCat = {};\n    st.txs.filter(t => t.t === \"out\").forEach(t => { byCat[t.c] = (byCat[t.c] || 0) + t.v; });\n    const maxCat = Math.max(1, ...Object.values(byCat));\n    const cats = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]).map(name => ({\n      name, amount: this.money(byCat[name]), w: Math.round((byCat[name] / maxCat) * 100) + \"%\"\n    }));\n\n    const today = 4;\n    const billsOpen = st.bills.filter(b => !b.paid).reduce((a, b) => a + b.v, 0);\n    const maxMonth = Math.max(1, ...st.months.map(m => Math.max(m.in, m.out)));\n\n    const idea = st.ideas[st.ideaSel] || { title: \"—\", steps: [] };\n    const periods = [[\"dia\", \"Hoje\"], [\"semana\", \"Esta semana\"], [\"mes\", \"Este mês\"]];\n\n    return {\n      isHub: v === \"hub\" && !st.narrow,\n      isHubMobile: v === \"hub\" && st.narrow,\n      isPanel: v !== \"hub\",\n      isBrainPanel: v === \"brain\",\n      isFinPanel: v === \"fin\",\n      isIdeasPanel: v === \"ideias\",\n      isCheckPanel: v === \"check\",\n      isFlowPanel: v === \"flows\",\n      brainRef: this.brainRef,\n      hubRef: this.hubRef,\n      hubStamp: \"sexta, 4 de setembro\",\n      hubCount: st.notes.length + \" registros · \" + st.ideas.length + \" ideias · \" + st.tasks.filter(t => !t.done).length + \" afazeres abertos\",\n      panelKicker: meta[0],\n      panelTitle: meta[1],\n      openBrain: () => this.enter(\"brain\"),\n      openFin: () => this.enter(\"fin\"),\n      openIdeias: () => this.enter(\"ideias\"),\n      openCheck: () => this.enter(\"check\"),\n      openFlows: () => this.enter(\"flows\"),\n      back: () => this.setState({ view: \"hub\" }),\n\n      query: st.query,\n      hasQuery: !!q,\n      aiAnswer,\n      aiSources,\n      onQuery: (e) => this.setState({ query: e.target.value }),\n      chips,\n      results: results.map(n => ({ ...n, isImage: n.type === \"IMAGEM\", slot: n.slot || \"imagem\" })),\n      resultLabel: results.length + (results.length === 1 ? \" registro\" : \" registros\") + (q ? \" correspondendo à busca\" : \" guardados\"),\n      nn: st.nn,\n      onNoteTitle: (e) => this.setState({ nn: { ...st.nn, t: e.target.value } }),\n      onNoteBody: (e) => this.setState({ nn: { ...st.nn, body: e.target.value } }),\n      onNoteTags: (e) => this.setState({ nn: { ...st.nn, tags: e.target.value } }),\n      addNote: () => {\n        if (!st.nn.t.trim()) return;\n        const tags = st.nn.tags.split(/[,\\s]+/).filter(Boolean);\n        this.setState({ notes: [{ t: st.nn.t, type: \"NOTA\", tags, body: st.nn.body }, ...st.notes], nn: { t: \"\", body: \"\", tags: \"\" } });\n      },\n\n      finIn: this.money(inSum),\n      finOut: this.money(outSum),\n      finBalance: this.money(inSum - outSum),\n      billsTotal: this.money(billsOpen),\n      txs: st.txs.map(x => ({ ...x, amount: (x.t === \"in\" ? \"+\" : \"−\") + this.money(x.v).slice(3), color: x.t === \"in\" ? \"#c4a6ff\" : \"#f2eefb\" })),\n      cats,\n      months: st.months.map(m => ({\n        label: m.label,\n        hIn: Math.round((m.in / maxMonth) * 100) + \"%\",\n        hOut: Math.round((m.out / maxMonth) * 100) + \"%\",\n        net: (m.in - m.out >= 0 ? \"+\" : \"−\") + this.short(Math.abs(m.in - m.out)),\n        netColor: m.in - m.out >= 0 ? \"#c4a6ff\" : \"#ffb4b4\"\n      })),\n      goals: st.goals.map(g => ({\n        name: g.name,\n        label: this.money(g.saved) + \" / \" + this.money(g.target),\n        w: Math.min(100, Math.round((g.saved / g.target) * 100)) + \"%\"\n      })),\n      bills: st.bills.map((b, k) => {\n        const late = !b.paid && b.due < today;\n        return {\n          d: b.d,\n          amount: this.money(b.v),\n          mark: b.paid ? \"✓\" : \"\",\n          deco: b.paid ? \"line-through\" : \"none\",\n          color: b.paid ? \"#7a7096\" : \"#f2eefb\",\n          dueLabel: b.paid ? \"pago\" : (late ? \"venceu dia \" + b.due : \"vence dia \" + b.due),\n          dueColor: b.paid ? \"#7a7096\" : (late ? \"#ffb4b4\" : \"#a99ec2\"),\n          boxBd: b.paid ? \"rgba(196,166,255,0.85)\" : \"rgba(255,255,255,0.24)\",\n          boxBg: b.paid ? \"#c4a6ff\" : \"transparent\",\n          onToggle: () => this.setState({ bills: st.bills.map((x, i) => i === k ? { ...x, paid: !x.paid } : x) })\n        };\n      }),\n      nf: st.nf,\n      onFinDesc: (e) => this.setState({ nf: { ...st.nf, d: e.target.value } }),\n      onFinVal: (e) => this.setState({ nf: { ...st.nf, v: e.target.value } }),\n      toggleFinType: () => this.setState({ nf: { ...st.nf, t: st.nf.t === \"in\" ? \"out\" : \"in\" } }),\n      finTypeLabel: st.nf.t === \"in\" ? \"entrada\" : \"saída\",\n      finTypeBd: st.nf.t === \"in\" ? \"rgba(196,166,255,0.55)\" : \"rgba(255,255,255,0.2)\",\n      finTypeBg: st.nf.t === \"in\" ? \"rgba(169,123,255,0.16)\" : \"rgba(255,255,255,0.05)\",\n      finTypeFg: st.nf.t === \"in\" ? \"#e4d5ff\" : \"#ddd6ec\",\n      addTx: () => {\n        const val = parseFloat(String(st.nf.v).replace(\",\", \".\"));\n        if (!st.nf.d.trim() || !val) return;\n        this.setState({ txs: [{ d: st.nf.d, v: val, t: st.nf.t, c: st.nf.t === \"in\" ? \"Trabalho\" : \"Outros\" }, ...st.txs], nf: { d: \"\", v: \"\", t: st.nf.t } });\n      },\n\n      ideas: st.ideas.map((i, k) => ({\n        title: i.title,\n        meta: i.steps.length ? i.steps.length + \" passos\" : \"sem plano ainda\",\n        bd: k === st.ideaSel ? \"rgba(196,166,255,0.6)\" : \"rgba(255,255,255,0.1)\",\n        bg: k === st.ideaSel ? \"rgba(169,123,255,0.14)\" : \"rgba(255,255,255,0.035)\",\n        onClick: () => this.setState({ ideaSel: k })\n      })),\n      ideaTitle: idea.title,\n      ideaSteps: idea.steps.map((text, k) => ({ n: String(k + 1).padStart(2, \"0\"), text })),\n      ni: st.ni,\n      ns: st.ns,\n      onIdeaInput: (e) => this.setState({ ni: e.target.value }),\n      onStepInput: (e) => this.setState({ ns: e.target.value }),\n      addIdea: () => {\n        if (!st.ni.trim()) return;\n        this.setState({ ideas: [{ title: st.ni, steps: [] }, ...st.ideas], ni: \"\", ideaSel: 0 });\n      },\n      addStep: () => {\n        if (!st.ns.trim() || !st.ideas.length) return;\n        this.setState({ ideas: st.ideas.map((i, k) => k === st.ideaSel ? { ...i, steps: [...i.steps, st.ns] } : i), ns: \"\" });\n      },\n\n      columns: periods.map(([p, name]) => {\n        const items = st.tasks.map((t, k) => ({ t, k })).filter(o => o.t.p === p);\n        const done = items.filter(o => o.t.done).length;\n        return {\n          name,\n          progress: done + \"/\" + items.length,\n          items: items.map(({ t, k }) => ({\n            text: t.text,\n            mark: t.done ? \"✓\" : \"\",\n            deco: t.done ? \"line-through\" : \"none\",\n            color: t.done ? \"#7a7096\" : \"#f2eefb\",\n            boxBd: t.done ? \"rgba(196,166,255,0.85)\" : \"rgba(255,255,255,0.24)\",\n            boxBg: t.done ? \"#c4a6ff\" : \"transparent\",\n            onToggle: () => this.setState({ tasks: st.tasks.map((x, i) => i === k ? { ...x, done: !x.done } : x) })\n          })),\n          draft: st.draft[p],\n          onDraft: (e) => this.setState({ draft: { ...st.draft, [p]: e.target.value } }),\n          onAdd: () => {\n            const val = st.draft[p].trim();\n            if (!val) return;\n            this.setState({ tasks: [...st.tasks, { text: val, done: false, p }], draft: { ...st.draft, [p]: \"\" } });\n          }\n        };\n      }),\n\n      flows: st.flows.map((f, k) => ({\n        name: f.name,\n        desc: f.desc,\n        badge: f.steps.length + \" passos\",\n        open: st.flowOpen === k,\n        bd: st.flowOpen === k ? \"rgba(196,166,255,0.4)\" : \"rgba(255,255,255,0.1)\",\n        bg: st.flowOpen === k ? \"rgba(169,123,255,0.08)\" : \"rgba(255,255,255,0.03)\",\n        steps: f.steps.map((text, i) => ({ n: String(i + 1).padStart(2, \"0\"), text })),\n        onClick: () => this.setState({ flowOpen: st.flowOpen === k ? -1 : k })\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
